[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soybean_leaf_disease_detection", "models/dinov3"]

[tool.hatch.build.targets.wheel.sources]
"models/dinov3" = "dinov3"

[project]
name = "soybean_leaf_disease_detection"
version = "0.0.1"
description = "Soybean leaf disease detection."
authors = [
  { name = "Krishnagopal Halder" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["soybean_leaf_disease_detection"]
include = ["pyproject.toml", "soybean_leaf_disease_detection/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["soybean_leaf_disease_detection"]
force-sort-within-sections = true

